<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Table</title>
    <link rel="stylesheet" href="steyle-6.css">
</head>
<body>
    <div class="table-container">
        <table>
            <tr>
                <th colspan="3">Product</th>
            </tr>
            <tr>
                <th>No</th>
                <th>P. Name</th>
                <th>P. Count</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Pen</td>
                <td rowspan="3">50</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Book</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Dust</td>
            </tr>
        </table>
    </div>
</body>
</html>
