<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in HTML</title>
    <link rel="stylesheet" href="style-8.css">
</head>
<body>

    <h2>Table in HTML</h2>

    <table>
        <tr>
            <td rowspan="2">A</td>
            <td colspan="2">B</td>
            <td rowspan="2">D</td>
            <td colspan="2">E</td>
            <td>F</td>
        </tr>
        <tr>
            <td rowspan="2">C</td>
            <td rowspan="2">J</td>
            <td colspan="2">G</td>
            <td>I</td>
        </tr>
        <tr>
            <td rowspan="2">K</td>
            <td colspan="2">L</td>
            <td>M</td>
        </tr>
    </table>

    <div class="info">
        <div class="column">
            <h3>HTML tag</h3>
            <ul>
                <li>✔ table</li>
                <li>✔ tr</li>
                <li>✔ td</li>
                <li>✔ th</li>
            </ul>
        </div>
        <div class="column">
            <h3>Attribute</h3>
            <ul>
                <li>✔ rowspan</li>
                <li>✔ colspan</li>
                <li>✔ border</li>
            </ul>
        </div>
    </div>

</body>
</html>
