<!DOCTYPE html>
<html lang="en">

    <title>Section Table</title>
    <link rel="stylesheet" href="steyle-4.css">
</head>
<body>

    <table>
        <tr>
            <td rowspan="6" class="section">Section</td>
            <td rowspan="3" class="subsection">Subsection 1</td>
            <td>Text1</td>
        </tr>
        <tr>
            <td>Text2</td>
        </tr>
        <tr>
            <td>Text3</td>
        </tr>
        <tr>
            <td rowspan="2" class="subsection">Subsection 2</td>
            <td></td>
        </tr>
        <tr>
            <td></td>
        </tr>
        <tr>
            <td class="subsection">Subsection 3</td>
            <td></td>
        </tr>
    </table>

</body>
</html>
